[project]
name = "docserver"
version = "0.1.0"
description = "Servidor de documentação para agentes (RAG local via MCP)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.3",
    "fastmcp>=2.0",
    "markitdown[docx,pptx,xlsx,pdf]>=0.0.1a2",
    "pymupdf4llm>=0.0.5",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Camada vetorial (sentence-transformers + torch): ~1.5GB, opcional via
# `docker build --build-arg COM_EMBEDDINGS=false` para imagens mais leves.
# Sem esta extra, a busca cai graciosamente para BM25 puro (ver ARQUITETURA.md).
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[project.scripts]
docserver = "docserver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "lento: testes que carregam o modelo real de embeddings (excluídos por padrão)",
]
addopts = "-m 'not lento'"
